# CI (PHASES P0). The required check is the aggregate job `ci`. Hardening:
# top-level permissions {}, contents: read per job, persist-credentials: false,
# no caches, no expressions inside run: (values come in through env:), actions
# pinned to full SHAs and downloaded binaries checked against pinned sha256 sums.
# CI never calls Wikidata, RCE, Lettermint, R2 or Cloudflare (CLAUDE.md invariant 9).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only; every commit on main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - name: pnpm policy is in effect (pnpm ignores a misspelt key)
        run: |
          test "$(pnpm config get minimumReleaseAge)" = 10080
          test "$(pnpm config get strictDepBuilds)" = true
          test "$(pnpm config get blockExoticSubdeps)" = true
      # pnpm 12.5.1 still lets a transitive https tarball through blockExoticSubdeps.
      - name: Every lockfile resolution is a registry integrity hash (no git or tarball source)
        run: |
          if grep 'resolution:' pnpm-lock.yaml | grep -vE '^\s+resolution: \{integrity: sha512-[A-Za-z0-9+/]+=*\}$'; then
            echo "pnpm-lock.yaml resolves a package from outside the registry" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The dbmate round trip: the test creates a database on the PG 18 service and
  # runs the migrate role (dbmate migrate) → a rollback of every migration → migrate.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          # Throwaway CI-only credential for an ephemeral service container.
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DBMATE_VERSION: v2.36.0
      DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dbmate (pinned, sha256-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/$DBMATE_VERSION/dbmate-linux-amd64"
          echo "$DBMATE_SHA256  $RUNNER_TEMP/bin/dbmate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:integration (dbmate up → down → up on a new database)
        env:
          PG_LOG_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test:integration

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned, sha256-checked)
        run: |
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
      - name: shellcheck every shell script (deploy/bin has no extensions; '*.sh' covers deploy/tests)
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'deploy/bin/*' 'deploy/tests/*.sh')
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" "${files[@]}"

  # Chromium and WebKit run in the pinned Playwright image; the smoke server runs on the
  # runner's Node 26 (host network, so the container reaches it on 127.0.0.1).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      E2E_PORT: '4173'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n
      - name: Start the smoke server and wait for /healthz
        run: |
          node apps/web/e2e/server.ts >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$E2E_PORT/healthz" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "the smoke server did not answer on /healthz" >&2
          cat "$RUNNER_TEMP/smoke.log" >&2
          exit 1
      - name: Playwright (chromium + webkit) in the pinned image
        run: |
          docker run --rm --init --network host --ipc=host -e CI=true \
            -e "E2E_BASE_URL=http://127.0.0.1:$E2E_PORT" \
            -v "$PWD:/work" -w /work/apps/web "$PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright test -c e2e/playwright.config.ts

  ci:
    name: ci
    if: always()
    needs: [check, integration, shellcheck, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
