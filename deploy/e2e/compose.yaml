# CI only: the stack Playwright runs against (A§18). Driven by deploy/e2e/stack.sh, which sets
# E2E_SECRETS (a temp directory of throw-away file secrets) and DBMATE_BIN. Project `mjk-e2e`.
# Nothing here calls Wikidata, RCE, Lettermint, R2 or Cloudflare: every network is internal, and nothing
# is published to the host. P2a: the edge also answers as Cloudflare Access's certs host and as Lettermint's API
# (a throw-away CA in E2E_PKI, trusted by `api` and `worker` only; `mailsink` keeps the mails). `edge` and `tunnel-edge` copy A§17.3's mjk-edge and mjk-tunnel-edge with
# caddy's and cloudflared's fixed addresses, so the production Caddyfile runs here unchanged.
# P3b: the photo pipeline as in production (A§17.1): `api` and `worker` share quarantine, `worker` and `media` share
# media-work (tmpfs volumes owned by 63532, below), `media` has no network at all, and the worker publishes to the
# MinIO stand-in through the edge's r2.mjk.test, an https origin as the production R2 client requires.
name: mjk-e2e

x-node: &node
  image: node:26.13.1-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
  working_dir: /app
  volumes:
    - ../..:/app:ro
  user: "63532:63532"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256

x-caddy: &caddy
  image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
  # Un-hardened on purpose: the stock image's file capability breaks exec under cap_drop: ALL.
  # P1e's own web image strips it and gets the full hardening.
  tmpfs:
    - /data
    - /config

services:
  db:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: "63532:63532"
    environment:
      POSTGRES_DB: mjk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    tmpfs:
      - /var/lib/postgresql:uid=63532,gid=63532,mode=0700
      - /var/run/postgresql:uid=63532,gid=63532,mode=0755
    secrets:
      - db_postgres
      - db_mjk_migrator
      - db_mjk_api
      - db_mjk_ssr
      - db_mjk_worker
      - db_mjk_backup
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mjk"]
      interval: 2s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "migrate"]
    volumes:
      - ../..:/app:ro
      - ${DBMATE_BIN:?set DBMATE_BIN to a dbmate 2.36.0 binary}:/usr/local/bin/dbmate:ro
    secrets:
      - db_mjk_migrator
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *node
    command: ["node", "apps/server/scripts/seed-e2e.ts"]
    secrets:
      - db_mjk_api
      - db_mjk_worker
      - db_mjk_migrator
    depends_on:
      db:
        condition: service_healthy

  # Stands in for R2's media bucket (A§12, A§15.3): `tiles` fills it, the edge's media.mjk.test site serves it.
  # Chainguard's MinIO by digest (the integration job's image). Internal network only: nothing leaves the stack.
  minio:
    image: cgr.dev/chainguard/minio@sha256:634c989a2f1029162fc2676c263caa181213b9410449968532f750a6fb77532d
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001", "--config-dir", "/tmp/minio"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
    user: "63532:63532"
    read_only: true
    tmpfs:
      - /data:uid=63532,gid=63532,mode=0700
      - /tmp:uid=63532,gid=63532,mode=0700
    secrets:
      - minio_root_user
      - minio_root_password
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  # One-shot, after minio: the bucket, its anonymous-read policy for tiles/* and p/* and the fixture tiles.
  tiles:
    <<: *node
    command: ["node", "apps/server/scripts/seed-e2e-tiles.ts"]
    secrets:
      - r2_media_rw
    depends_on:
      - minio

  api:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "api"]
    # The admin host's Access settings (A§9): test values only, never the real ones. NODE_EXTRA_CA_CERTS: the api
    # fetches Access's certs from the edge's test-team.cloudflareaccess.com, signed by the throw-away CA.
    environment:
      MJK_DOMAIN: mjk.test
      CF_ACCESS_TEAM: test-team
      CF_ACCESS_AUD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NODE_EXTRA_CA_CERTS: /e2e-ca.pem
    volumes:
      - ../..:/app:ro
      - ${E2E_PKI:?set E2E_PKI to the PKI directory}/ca.pem:/e2e-ca.pem:ro
      - quarantine:/srv/mjk/quarantine
      # The disk guard's directory, as in production (read-only; stack.sh writes a fresh guard/disk before each pass).
      - ${E2E_GUARD:?set E2E_GUARD to the guard directory}:/srv/mjk/state/guard:ro
    networks: [default, edge]
    secrets:
      - db_mjk_api
      - app_keys
    # A§17.2's limits: the load pass (auth-load.spec.ts) must not push the api over them.
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  # The mail jobs (A§9): sends through the real Lettermint client to api.lettermint.co, which the edge answers.
  worker:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "worker"]
    environment:
      MJK_BRAND_NAME: Testmerk
      MJK_DOMAIN: mjk.test
      MJK_MAIL_FROM: noreply@mjk.test
      MJK_MAIL_CAP: "300"
      MJK_CONTACT_EMAIL: info@mjk.test
      NODE_EXTRA_CA_CERTS: /e2e-ca.pem
      # The media bucket (P3b): the MinIO stand-in behind the edge, under the throw-away CA.
      MJK_R2_ENDPOINT: https://r2.mjk.test
      MJK_R2_BUCKET_MEDIA: mjk-media
    volumes:
      - ../..:/app:ro
      - ${E2E_PKI:?}/ca.pem:/e2e-ca.pem:ro
      - quarantine:/srv/mjk/quarantine
      - originals:/srv/mjk/originals
      - media-work:/srv/mjk/media-work
    secrets:
      - db_mjk_worker
      - app_keys
      - lettermint_api_token
      - r2_media_rw
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  # The photo decoder (P3b), as production's `media`: no network at all, no secret, no environment, one mount and
  # A§17.2's limits. stack.sh checks its restarts and OOM kills after the main pass.
  media:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "media"]
    network_mode: none
    # As production: a crash of the role restarts it (its watchdog kills only the task's child), and stack.sh's
    # restart count sees it.
    restart: unless-stopped
    volumes:
      - ../..:/app:ro
      - media-work:/srv/mjk/media-work
    ulimits:
      fsize:
        soft: 64000000
        hard: 64000000
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Lettermint's stand-in (deploy/e2e/mail-sink.mjs): the specs read the codes from it.
  mailsink:
    <<: *node
    command: ["node", "deploy/e2e/mail-sink.mjs"]

  # The owner's curation tool, as production's `admin` job (`compose run --rm -T admin invite create …`).
  admin:
    <<: *node
    profiles: [tools]
    entrypoint: ["node", "apps/server/src/main.ts", "admin"]
    command: []
    secrets:
      - db_mjk_api
      - app_keys
    depends_on:
      db:
        condition: service_healthy

  # Access's stand-in (deploy/e2e/access-stub.mjs): writes jwks.json into E2E_PKI and prints one JWT per owner.
  access-stub:
    <<: *node
    profiles: [tools]
    command: ["node", "deploy/e2e/access-stub.mjs", "/pki", "owner-chromium@mjk.test", "owner-webkit@mjk.test"]

  ssr:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "ssr"]
    environment:
      MJK_BRAND_NAME: Testmerk
      MJK_DOMAIN: mjk.test
      MJK_CONTROLLER_NAME: Test Beheerder
      MJK_CONTACT_EMAIL: info@mjk.test
    networks: [default, edge]
    secrets:
      - db_mjk_ssr
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  caddy:
    <<: *caddy
    environment:
      MJK_DOMAIN: mjk.test
      MJK_PROFILE: prelaunch
    volumes:
      - ../web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/profile-prelaunch.caddy:/etc/caddy/profile-prelaunch.caddy:ro
      - ../../apps/web/dist/client:/srv/web:ro
    # Only on the two edge networks, as in production: its peers are the api, ssr and the edge.
    networks:
      edge:
        ipv4_address: 10.63.2.10
      tunnel-edge:
        ipv4_address: 10.63.6.11
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8089/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
      ssr:
        condition: service_healthy

  # Stands in for Cloudflare's edge and cloudflared: TLS for mjk.test, admin.mjk.test and media.mjk.test (R2's custom
  # domain, in front of minio), X-Forwarded-Proto, the visitor's address appended to X-Forwarded-For, from
  # cloudflared's fixed 10.63.6.10. Also the outside names the api and the worker dial (P2a; P3b's r2.mjk.test, R2's
  # S3 API), under E2E_PKI's CA.
  edge:
    <<: *caddy
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${E2E_PKI:?}:/pki:ro
    networks:
      default:
        aliases:
          - mjk.test
          - admin.mjk.test
          - media.mjk.test
          - test-team.cloudflareaccess.com
          - api.lettermint.co
          - r2.mjk.test
      tunnel-edge:
        ipv4_address: 10.63.6.10
    depends_on:
      caddy:
        condition: service_healthy

  # The Caddy cases (deploy/e2e/caddy-cases.mjs), run by stack.sh with `compose run`: an untrusted peer on
  # both edge networks, next to the api and ssr, and next to the edge.
  probe:
    <<: *node
    profiles: [cases]
    command: ["node", "deploy/e2e/caddy-cases.mjs", "echo"]
    networks:
      edge:
        ipv4_address: 10.63.2.20
      tunnel-edge:
        ipv4_address: 10.63.6.20

networks:
  default:
    internal: true
  # Fixed addresses below .128, Docker's own from the upper half.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 10.63.2.0/24
          ip_range: 10.63.2.128/25
  tunnel-edge:
    internal: true
    ipam:
      config:
        - subnet: 10.63.6.0/24
          ip_range: 10.63.6.128/25

# P3b: the shared photo directories. tmpfs, owned by the containers' 63532 (no host directory to chown as root, and
# nothing left behind: `down -v` removes them). One mount is shared by every container that names the volume.
volumes:
  quarantine:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=63532,gid=63532,mode=0700"}
  originals:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=63532,gid=63532,mode=0700"}
  # As production: capped at 256 MB (A§17.1).
  media-work:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=256m,uid=63532,gid=63532,mode=0700"}

secrets:
  db_postgres:
    file: ${E2E_SECRETS:?set E2E_SECRETS to the secrets directory}/db_postgres
  db_mjk_migrator:
    file: ${E2E_SECRETS:?}/db_mjk_migrator
  db_mjk_api:
    file: ${E2E_SECRETS:?}/db_mjk_api
  db_mjk_ssr:
    file: ${E2E_SECRETS:?}/db_mjk_ssr
  db_mjk_worker:
    file: ${E2E_SECRETS:?}/db_mjk_worker
  db_mjk_backup:
    file: ${E2E_SECRETS:?}/db_mjk_backup
  minio_root_user:
    file: ${E2E_SECRETS:?}/minio_root_user
  minio_root_password:
    file: ${E2E_SECRETS:?}/minio_root_password
  # The AWS credentials format of the real secret (A§17.3), with the same two values.
  r2_media_rw:
    file: ${E2E_SECRETS:?}/r2_media_rw
  # Four lines name=<32 random bytes, base64url> (apps/server/src/auth/keys.ts) and a random token.
  app_keys:
    file: ${E2E_SECRETS:?}/app_keys
  lettermint_api_token:
    file: ${E2E_SECRETS:?}/lettermint_api_token
