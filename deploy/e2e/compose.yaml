# CI only: the stack Playwright runs against (A§18). Driven by deploy/e2e/stack.sh, which sets
# E2E_SECRETS (a temp directory of throw-away file secrets) and DBMATE_BIN. Project `mjk-e2e`.
# Nothing here calls Wikidata, RCE, Lettermint, R2 or Cloudflare; nothing is published to the host.
name: mjk-e2e

x-node: &node
  image: node:26.13.1-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
  working_dir: /app
  volumes:
    - ../..:/app:ro
  user: "63532:63532"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256

x-caddy: &caddy
  image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
  # Un-hardened on purpose: the stock image's file capability breaks exec under cap_drop: ALL.
  # P1e's own web image strips it and gets the full hardening.
  tmpfs:
    - /data
    - /config

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "63532:63532"
    environment:
      POSTGRES_DB: mjk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    tmpfs:
      - /var/lib/postgresql:uid=63532,gid=63532,mode=0700
      - /var/run/postgresql:uid=63532,gid=63532,mode=0755
    secrets:
      - db_postgres
      - db_mjk_migrator
      - db_mjk_api
      - db_mjk_ssr
      - db_mjk_worker
      - db_mjk_backup
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mjk"]
      interval: 2s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "migrate"]
    volumes:
      - ../..:/app:ro
      - ${DBMATE_BIN:?set DBMATE_BIN to a dbmate 2.36.0 binary}:/usr/local/bin/dbmate:ro
    secrets:
      - db_mjk_migrator
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *node
    command: ["node", "apps/server/scripts/seed-e2e.ts"]
    secrets:
      - db_mjk_api
      - db_mjk_worker
      - db_mjk_migrator
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "api"]
    secrets:
      - db_mjk_api
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  ssr:
    <<: *node
    command: ["node", "apps/server/src/main.ts", "ssr"]
    environment:
      MJK_BRAND_NAME: Testmerk
      MJK_DOMAIN: mjk.test
    secrets:
      - db_mjk_ssr
    healthcheck:
      test: ["CMD", "node", "apps/server/src/main.ts", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  caddy:
    <<: *caddy
    environment:
      MJK_DOMAIN: mjk.test
    volumes:
      - ../web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/web/dist/client:/srv/web:ro
    depends_on:
      api:
        condition: service_healthy
      ssr:
        condition: service_healthy

  # Stands in for Cloudflare's edge: TLS for mjk.test, X-Forwarded-Proto https.
  edge:
    <<: *caddy
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - mjk.test
    depends_on:
      - caddy

secrets:
  db_postgres:
    file: ${E2E_SECRETS:?set E2E_SECRETS to the secrets directory}/db_postgres
  db_mjk_migrator:
    file: ${E2E_SECRETS:?}/db_mjk_migrator
  db_mjk_api:
    file: ${E2E_SECRETS:?}/db_mjk_api
  db_mjk_ssr:
    file: ${E2E_SECRETS:?}/db_mjk_ssr
  db_mjk_worker:
    file: ${E2E_SECRETS:?}/db_mjk_worker
  db_mjk_backup:
    file: ${E2E_SECRETS:?}/db_mjk_backup
